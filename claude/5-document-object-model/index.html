<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document Object Model</title>
  </head>
  <body>
    <h1>DOM</h1>
    <img
      src="https://www.petz.com.br/blog/wp-content/uploads/2026/07/gato-frajola-4-scaled.jpg"
      alt="Gato frajola"
    />

    <div class="names">
      <ul>
        <li>Alisson</li>
        <li>Alane</li>
        <li>Alan</li>
        <li>Aila</li>
      </ul>
      <button class="namesButton">Adicionar</button>
    </div>

    <div class="form">
      <form id="firstForm">
        <input class="formInput" type="text" />
        <button class="formButton">Enviar</button>
      </form>
    </div>

    <div class="coin">
      <form id="secondaryForm">
        <input class="coinInput" type="text" placeholder="R$ 0,00">
      </form>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
